# marvosa-run.yaml — Llama Stack tool-runtime configuration for Marvosa.
#
# Meta's consumer AI app has no MCP support or submission channel; Llama
# Stack is Meta's MCP door. Its tool runtime consumes remote MCP servers,
# so start the HTTP transport first:
#
#     python3 hcl-ai/marvosa_mcp_http.py            # serves http://localhost:8848/mcp
#
# Then EITHER merge the blocks below into your distribution's run.yaml
# (llama stack run ./run.yaml), OR register at runtime without any file:
#
#     from llama_stack_client import LlamaStackClient
#     client = LlamaStackClient(base_url="http://localhost:8321")
#     client.toolgroups.register(
#         toolgroup_id="mcp::marvosa",
#         provider_id="model-context-protocol",
#         mcp_endpoint={"uri": "http://localhost:8848/mcp"},
#     )
#
# Agents then take the toolgroup by id:  toolgroups=["mcp::marvosa"]

version: '2'
image_name: marvosa

apis:
- agents
- inference
- tool_runtime

providers:
  tool_runtime:
  - provider_id: model-context-protocol
    provider_type: remote::model-context-protocol
    config: {}
  # inference/agents providers come from your own distribution (ollama,
  # together, fireworks, meta-reference, ...) — keep yours; only the
  # tool_runtime provider and the tool group below belong to Marvosa.

tool_groups:
- toolgroup_id: mcp::marvosa
  provider_id: model-context-protocol
  mcp_endpoint:
    uri: http://localhost:8848/mcp
