# Project-scoped Codex configuration (trusted projects only).
# Codex CLI and the Codex IDE extension both read this file when the cloned
# repo is opened and trusted, and offer the Marvosa MCP server automatically.
# Manual alternative:  codex mcp add marvosa -- python3 hcl-ai/marvosa_mcp.py

[mcp_servers.marvosa]
command = "python3"
args = ["hcl-ai/marvosa_mcp.py"]
# The organism wakes from its memory line on first start; allow it time.
startup_timeout_sec = 120
tool_timeout_sec = 300
enabled = true
